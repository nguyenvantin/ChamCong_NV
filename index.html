<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chấm công & Tính lương</title>
<style>
:root{--p:#2563eb;--pd:#1e3a8a;--bg:#e8eef9;--bd:#dbe3f0;--tx:#0f172a;--mu:#64748b;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--tx);font-size:15px;padding-bottom:68px}
header{background:linear-gradient(90deg,var(--pd),var(--p));color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:10px;font-weight:700}
.av{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--pd);display:grid;place-items:center;font-size:17px;font-weight:800;text-transform:uppercase}
.who small{display:block;color:#bfdbfe;font-weight:400;font-size:12px}
header button.ghost,header button.gray{background:rgba(255,255,255,.18);color:#fff}
nav{position:sticky;top:0;z-index:10;display:flex;gap:6px;padding:8px 10px;background:#fff;box-shadow:0 2px 6px #1e3a8a1a;overflow-x:auto}
nav button{background:#eaf0ff;color:var(--p);white-space:nowrap;padding:9px 15px;border-radius:999px;transition:0.2s}
nav button.on{background:var(--p);color:#fff;box-shadow:0 2px 6px #2563eb55}
main{padding:12px;max-width:1320px;margin:auto}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;overflow-x:auto;box-shadow:0 2px 8px #1e3a8a12}
.card h3{margin:0 0 10px;font-size:16px;border-left:4px solid var(--p);padding-left:9px}
.card.center{text-align:center;background:linear-gradient(160deg,var(--pd),var(--p));color:#fff;border:0}
.card.center .mu{color:#bfdbfe}.card.center .ok{color:#86efac}.card.center .bad{color:#fecaca}
.center{text-align:center}
button{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--p);color:#fff;font-size:14px;font-weight:600;transition:0.15s}
button:hover{filter:brightness(1.08)}
button.red{background:var(--bad)}button.green{background:var(--ok)}button.gray{background:#64748b}
button.ghost{background:#e2e8f0;color:var(--tx)}
button.sm{padding:5px 10px;font-size:13px;border-radius:8px}
button.xs{padding:2px 6px;font-size:11px;border-radius:6px}
button.big{font-size:28px;padding:26px 56px;border-radius:18px;margin:10px 0;width:min(100%,380px);box-shadow:0 6px 16px #0004}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{padding:9px;border:1px solid #c3cee0;border-radius:10px;font-size:15px;max-width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #93c5fd}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:left;white-space:nowrap}
th{background:#e0e7ff;color:#3730a3;font-weight:700}
tr:nth-child(even) td{background:#f5f8fd}
.mu{color:var(--mu)}.bad{color:var(--bad)}.ok{color:var(--ok)}.tre{color:var(--warn);font-weight:700}
.clk{font-size:56px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.names button{padding:18px 8px;font-size:17px}
.names button small{display:block;font-weight:400;font-size:12px;opacity:.85}
.login{max-width:560px;margin:30px auto;text-align:center}
.note{background:#fffbeb;border:1px solid #fcd34d;border-left:4px solid #f59e0b;padding:9px 11px;border-radius:10px;font-size:13px;margin:8px 0;line-height:1.45}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:12px;display:none;z-index:99;max-width:92%;box-shadow:0 6px 16px #0006}
#toast.err{background:var(--bad)}
#offlineBar{display:none;background:#dc2626;color:#fff;text-align:center;padding:6px 12px;font-size:13px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px;font-weight:600}
.fld input,.fld select{width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.stat{border-radius:12px;padding:10px;text-align:center;background:#eff6ff;border:1px solid #bfdbfe}
.stat b{display:block;font-size:24px;color:#1d4ed8}.stat span{color:var(--mu);font-size:12px}
.stat:nth-child(2){background:#f0fdf4;border-color:#bbf7d0}.stat:nth-child(2) b{color:#15803d}
.stat:nth-child(3){background:#fffbeb;border-color:#fde68a}.stat:nth-child(3) b{color:#b45309}
.stat:nth-child(4){background:#fef2f2;border-color:#fecaca}.stat:nth-child(4) b{color:#b91c1c}
.wknav{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.wknav div{text-align:center;min-width:140px}.wknav b{font-size:18px;color:var(--pd)}.wknav small{display:block;color:var(--mu)}

/* Bộ lọc màu từng nhân viên (Legend) */
.emp-legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 12px}
.leg-btn{border:1.5px solid var(--ec-bd,#cbd5e1);background:var(--ec-bg,#fff);color:var(--ec-tx,#0f172a);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.leg-btn .dot{width:9px;height:9px;border-radius:50%;background:var(--ec-dot,#64748b);flex:none}
.leg-btn.on{outline:2.5px solid var(--p);box-shadow:0 2px 6px #2563eb33}

/* Lịch tuần trực quan: Thẻ tên màu riêng theo người + Giờ ca làm to rõ */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.day{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:0 0 10px;overflow:hidden;box-shadow:0 2px 8px #1e3a8a12}
.day.today{border:2px solid var(--p)}
.dh{font-weight:700;padding:10px 12px;background:#e0e7ff;color:#3730a3;display:flex;justify-content:space-between;align-items:center;font-size:15px}
.day.today .dh{background:var(--p);color:#fff}
.day>.mu{margin:8px 12px}
.tag{background:#fff;color:var(--p);font-size:11px;border-radius:999px;padding:2px 9px;font-weight:700}
.sl{padding:9px 10px;margin:8px 10px 0;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc}
.sn{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:0.4px;color:#334155;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.wcards{display:flex;flex-direction:column;gap:6px}
.wcard{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:var(--ec-bg,#fff);border:1.5px solid var(--ec-bd,#cbd5e1);border-left:6px solid var(--ec-dot,#2563eb);color:var(--ec-tx,#0f172a)}
.wcard.me{box-shadow:0 0 0 2px #1e3a8a44}
.wcard.wait{border-style:dashed;opacity:.92}
.wcard.off{background:#fef2f2;border-color:#fecaca;border-left-color:#dc2626;color:#991b1b;opacity:.85}
.wcard.off .wname,.wcard.off .wtime{text-decoration:line-through}
.wleft{display:flex;align-items:center;gap:7px;min-width:0}
.wav{width:24px;height:24px;border-radius:50%;background:var(--ec-dot,#2563eb);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;flex:none}
.wname{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbadge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.85);color:var(--ec-tx,#334155);border:1px solid var(--ec-bd,#cbd5e1);white-space:nowrap}
.wtime{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.92);color:#0f172a;padding:4px 9px;border-radius:8px;border:1px solid rgba(15,23,42,.12);white-space:nowrap;flex:none;letter-spacing:0.2px}

/* Lịch tuần: làm chìm ngày cũ nhưng vẫn rõ thẻ tên người làm */
.day.past{background:#f8fafc;border-color:#e2e8f0}
.day.past .dh{background:#e2e8f0;color:#64748b}
.day.past .sl{background:#f1f5f9;border-color:#e2e8f0;opacity:0.78;transition:opacity 0.2s}
.day.past .sl:hover{opacity:1}
.day.past .sn{color:#64748b}
.wcard.past{opacity:0.85;filter:saturate(0.45)}
.wcard.past .wtime{background:rgba(255,255,255,.7);color:#475569;font-size:12.5px}

/* Các class UI bị thiếu trong bản gốc */
.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;border:1px solid #cbd5e1;padding:4px 10px;border-radius:999px;font-size:13px}
.ckw.c0{--cc:#2563eb;--cb:#eff6ff}
.ckw.c1{--cc:#16a34a;--cb:#f0fdf4}
.ckw.c2{--cc:#d97706;--cb:#fffbeb}
.ckw.c3{--cc:#9333ea;--cb:#faf5ff}
.ckw.c4{--cc:#0d9488;--cb:#f0fdfa}

/* Lịch tháng 15 ngày trên 1 màn hình dạng ô */
.seg{display:inline-flex;background:#dbeafe;padding:4px;border-radius:12px;gap:4px}
.seg button{background:transparent;color:var(--pd);padding:7px 14px;border-radius:9px;font-size:13px;font-weight:700}
.seg button.on{background:var(--p);color:#fff;box-shadow:0 2px 6px #2563eb44}
.mgrid15{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.mday{background:#fff;border:1.5px solid #cbd5e1;border-radius:12px;min-height:112px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:0.15s}
.mday:hover{border-color:var(--p);box-shadow:0 3px 10px #2563eb22;transform:translateY(-1px)}
.mday.wknd{background:#f8fafc}
.mday.today{border:2.5px solid var(--p);box-shadow:0 3px 10px #2563eb33}
.mday-hd{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#e0e7ff;color:#1e3a8a;font-size:12px;font-weight:800}
.mday.wknd .mday-hd{background:#e2e8f0;color:#334155}
.mday.today .mday-hd{background:var(--p);color:#fff}
.mday-cnt{font-size:10px;font-weight:700;background:rgba(255,255,255,.85);color:#1e3a8a;padding:1px 6px;border-radius:999px}
.mday-body{padding:5px;display:flex;flex-direction:column;gap:4px;flex:1}
.mitem{display:flex;flex-direction:column;padding:3px 6px;border-radius:6px;background:var(--ec-bg,#f1f5f9);border-left:4px solid var(--ec-dot,#64748b);color:var(--ec-tx,#0f172a);font-size:11px;line-height:1.25}
.mitem-top{display:flex;justify-content:space-between;align-items:center;gap:3px;font-weight:800}
.mitem-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem-sub{font-size:10px;font-weight:600;opacity:.9;font-variant-numeric:tabular-nums}
.mitem.wait{border-style:dashed;border-width:1px;border-left-width:4px}
.mitem.off{background:#fef2f2;border-left-color:#dc2626;color:#991b1b;text-decoration:line-through;opacity:.8}
.mitem.abs{background:#fee2e2;border-left-color:#b91c1c;color:#991c1c}

.dkrow{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-top:1px solid var(--bd)}
.dkrow.today{background:#dbeafe;border-radius:10px;border-top-color:transparent}
.dkrow.today .dl{color:var(--p)}
.dl{width:58px;font-weight:800;flex:none;padding-top:8px}.dl small{display:block;color:var(--mu);font-weight:400}
.cks{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.ckw{position:relative}
.ckw>input.ck{position:absolute;opacity:0;width:0;height:0}
.ckw label{display:block;border:2px solid var(--cc,var(--bd));border-radius:12px;padding:8px 12px;min-width:108px;cursor:pointer;background:var(--cb,#fff);line-height:1.3;color:var(--tx)}
.ckw label small{display:block;color:var(--mu);font-size:12px;transition:0.2s}
.ckw label em{display:block;font-style:normal;font-size:11px;color:var(--warn);font-weight:700}
.ckw>input.ck:checked+label{background:var(--cc,var(--p));border-color:var(--cc,var(--p));color:#fff;box-shadow:0 3px 8px #0003}
.ckw>input.ck:checked+label small,.ckw>input.ck:checked+label em{color:#fff}
.ckw>input.ck:checked+label b::before{content:"✓ "}
.ckw>input.ck:disabled+label{opacity:.45;cursor:not-allowed}
.ckw>input.ck:disabled:checked+label{background:var(--ok);border-color:var(--ok);opacity:1}
.ckw>input.ck:focus-visible+label{outline:3px solid #93c5fd}
.tm{display:flex;align-items:center;gap:4px;margin-top:5px;color:var(--mu)}
.tm input{padding:5px 6px;font-size:13px;width:86px;border-radius:8px;border-color:var(--cc,#c3cee0)}
.tm input:disabled{opacity:.5}
.item{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;margin-top:6px;border-radius:10px;align-items:center;background:#f5f8fd;border-left:4px solid #cbd5e1}
.item.sCho{background:#fffbeb;border-left-color:#f59e0b}
.item.sDuyet{background:#f0fdf4;border-left-color:var(--ok)}
.item.sTuChoi{background:#fef2f2;border-left-color:var(--bad);opacity:.85}
.item.me{box-shadow:inset 0 0 0 2px #93c5fd}
.grp{background:#fffbeb;border:1px solid #fde68a;border-left:5px solid #f59e0b;border-radius:12px;padding:10px 12px;margin-top:10px}
.bg{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.bgok{background:#bbf7d0;color:#166534}.bgcho{background:#fde68a;color:#92400e}.bgno{background:#fecaca;color:#991b1b}.bgft{background:#ede9fe;color:#5b21b6}.bgpt{background:#ccfbf1;color:#115e59}.bggray{background:#e2e8f0;color:#475569}
.banner{background:#fff7ed;border:1px solid #fdba74;border-left:6px solid #f97316;color:#9a3412;padding:10px 12px;border-radius:12px;margin:8px 0 0;font-size:14px;font-weight:600}
.emps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.emp{border:1px solid var(--bd);border-top:6px solid var(--p);border-radius:14px;padding:12px;background:#fff;box-shadow:0 2px 8px #1e3a8a12}
.emp.ft{border-top-color:#7c3aed}.emp.pt{border-top-color:#0d9488}
.emp.sel{outline:3px solid #93c5fd;background:#f8fafc}
.eh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.emp .num{font-size:34px;font-weight:800;line-height:1.1;margin:4px 0}
.emp .num small{font-size:14px;font-weight:600;color:var(--mu);margin-left:4px}
.emp .ln{font-size:13px;color:var(--mu);margin:3px 0}
.emp .w{color:var(--bad);font-weight:700}
.emp .live{color:var(--ok);font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:9px 12px;border-radius:10px;margin-top:6px}
.chk.good{background:#f0fdf4;border-left:5px solid var(--ok)}
.chk.todo{background:#fff7ed;border-left:5px solid #f97316}
details.shift{border:1px solid var(--bd);border-left:5px solid var(--p);border-radius:10px;margin-top:6px;background:#fff}
details.shift.them{border-left-color:var(--warn)}
details.shift.warn{border-left-color:var(--bad);background:#fff7ed}
details.shift.live{border-left-color:var(--ok);background:#f0fdf4}
details.shift>summary{cursor:pointer;padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;list-style:none}
details.shift>summary::-webkit-details-marker{display:none}
details.shift>summary::after{content:"Sửa ▾";margin-left:auto;color:var(--p);font-size:13px;font-weight:700}
details.shift[open]>summary::after{content:"Đóng ▴"}
.edit{padding:6px 12px 12px;border-top:1px dashed var(--bd)}

/* Sheet Tabs & Spreadsheet Bảng Lương */
.stabs{display:flex;gap:6px;border-bottom:2px solid #cbd5e1;padding-bottom:0;margin:10px 0 12px;overflow-x:auto}
.stab{background:#e2e8f0;color:#334155;border-radius:10px 10px 0 0;padding:9px 16px;font-size:14px;font-weight:700;border:1px solid #cbd5e1;border-bottom:0;margin-bottom:-2px}
.stab.on{background:#fff;color:var(--p);border-color:#cbd5e1;border-bottom:2px solid #fff;box-shadow:0 -2px 6px #1e3a8a12}
.stbl{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
.stbl th,.stbl td{border-right:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;padding:6px 7px;vertical-align:middle}
.stbl th{background:#1e3a8a;color:#fff;font-weight:700;text-align:center;position:sticky;top:0;z-index:2}
.stbl tr:nth-child(even) td{background:#f8fafc}
.stbl tr:hover td{background:#eff6ff}
.stbl .st1{position:sticky;left:0;z-index:3;background:#fff;border-right:2px solid #94a3b8;min-width:145px}
.stbl tr:nth-child(even) td.st1{background:#f8fafc}
.stbl th.st1{background:#1e3a8a;z-index:4;text-align:left}
.stbl input[type="number"],.stbl input[type="text"],.stbl select{padding:6px 7px;font-size:13px;border-radius:7px;border:1px solid #cbd5e1;background:#fff}
.stbl input[type="number"]{width:96px;text-align:right;font-variant-numeric:tabular-nums}
.stbl input.sm-num{width:62px;text-align:center}
.stbl input.edited{border-color:#f59e0b;background:#fffbeb}
.stbl tfoot td{background:#e0e7ff !important;font-weight:800;color:#1e3a8a;border-top:2px solid #6366f1;padding:9px 7px;font-size:14px}
.cell-sub{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:11px;color:var(--mu);margin-top:3px}

/* Phiếu lương */
.slip{background:#fff;border:1px solid #cbd5e1;border-radius:14px;padding:18px;max-width:420px;margin:0 auto 16px;box-shadow:0 4px 14px rgba(15,23,42,0.08)}
.slip-hd{text-align:center;border-bottom:2px dashed #94a3b8;padding-bottom:12px;margin-bottom:12px}
.slip-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:14px;border-bottom:1px dashed #f1f5f9}
.slip-row:last-child{border-bottom:0}
.slip-tot{margin-top:12px;background:#f0fdf4;border:1px solid #86efac;border-left:5px solid var(--ok);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center}

#ltInfoBar{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -4px 16px rgba(0,0,0,0.18);padding:14px 20px;z-index:90;border-top:3px solid var(--p);animation:slideUp 0.2s ease-out;line-height:1.5;max-height:55vh;overflow-y:auto}
#ltInfoBar.show{display:block}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.cls-btn{position:absolute;top:10px;right:15px;background:#f1f5f9;color:#000;border-radius:50%;width:28px;height:28px;padding:0;font-size:16px;line-height:28px;text-align:center}

@media(max-width:760px){
  .mgrid15{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .mday{min-height:98px}
}
@media(max-width:600px){
  .clk{font-size:44px}.dl{width:48px}.ckw label{min-width:96px}
  .wname{font-size:13px}.wtime{font-size:13px;padding:3px 7px}
}
</style>
</head>
<body>
<div id="offlineBar">⚠️ Mất kết nối mạng! Vui lòng kiểm tra Wi-Fi / 4G trước khi lưu dữ liệu.</div>
<div id="app">Đang tải...</div>
<div id="toast"></div>
<div id="ltInfoBar"><button class="cls-btn" onclick="document.getElementById('ltInfoBar').classList.remove('show')">✕</button><div id="ltContent"></div></div>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

const tzParts = ms => {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hour12: false
  }).formatToParts(new Date(Number(ms)));
  const m = {};
  parts.forEach(p => m[p.type] = p.value);
  if (m.hour === '24') m.hour = '00';
  return m;
};
const dStr = ms => { const p = tzParts(ms); return `${p.year}-${p.month}-${p.day}`; };
const tStr = ms => { if (!ms) return '—'; const p = tzParts(ms); return `${p.hour}:${p.minute}`; };

const nowClock = () => new Date().toLocaleTimeString('vi-VN', {timeZone: TZ});
const toMs = s => {
  if (!s) return null;
  const clean = s.trim().length === 16 ? s.trim() + ':00' : s.trim();
  const t = new Date(clean + '+07:00').getTime();
  return isNaN(t) ? null : t;
};

function buildColorMap(nvList) {
  const sorted = [...nvList].filter(x => x.active !== false && x.role !== 'QuanLy').sort(byName);
  const byId = {}, byTen = {};
  sorted.forEach((n, idx) => {
    const pal = EMP_PALETTE[idx % EMP_PALETTE.length];
    byId[n.id] = pal;
    byTen[normName(n.ten)] = pal;
  });
  return (id, ten) => {
    if (id && byId[id]) return byId[id];
    const k = normName(ten);
    if (k && byTen[k]) return byTen[k];
    let h = 0;
    const str = String(id || ten || '');
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return EMP_PALETTE[h % EMP_PALETTE.length];
  };
}

const tong = rows => {
  const m = rows.filter(r => r.ra), c = m.filter(r => !isThem(r)), t = m.filter(isThem);
  const sum = a => r2(a.reduce((s, r) => s + hrs(r), 0));
  const congOf = {};
  c.forEach(r => congOf[r.ngay] = (congOf[r.ngay] || 0) + hrs(r));
  let cong = 0, leNgay = 0;
  Object.values(congOf).forEach(h => { if (h >= GIO_DU_CONG) cong++; else leNgay += h; });
  return {
    ngay: Object.values(congOf).filter(h => h > 0).length,
    cong, congOf,
    gioLeNgay: r2(leNgay),
    gioLe: r2(leNgay + sum(t)),
    gio: sum(m),
    gioChinh: sum(c),
    gioThem: sum(t)

};

const gio = (l, cm) => { const c = cm[l.ca] || {}; return {bat: l.bat || c.bat || '', ket: l.ket || c.ket || ''}; };
function isTre(r, lich, cm) {
  if (isThem(r) || !r.vao) return false;
  const ss = lich.filter(l => l.nvid === r.nvid && l.ngay === r.ngay && l.tt === 'Duyet' && gio(l, cm).bat).map(l => {
    const g = gio(l, cm);
    const sBat = toMs(l.ngay + 'T' + g.bat);
    let sKet = g.ket ? toMs(l.ngay + 'T' + g.ket) : (sBat + 4 * 3600000);
    if (sKet <= sBat) sKet += 864e5;
    return {sBat, sKet};
  });
  if (!ss.length) return false;
  const validShifts = ss.filter(x => r.vao < x.sKet);
  const pool = validShifts.length ? validShifts : ss;
  const s = pool.reduce((a, b) => Math.abs(b.sBat - r.vao) < Math.abs(a.sBat - r.vao) ? b : a).sBat;
  return r.vao > s + TRE_PHUT * 60000;
}

async function tatCa(n) {

  for (;;) {
    const d = await q(sb.from(n).select('*').order(n === 'ky' ? 'ky' : 'id').range(from, from + 999));

async function saveCloudData(key, obj) {
  const json = JSON.stringify(obj);
  localStorage.setItem(key, json);
  const inserted = await q(sb.from('nhatky').insert({luc: Date.now(), ai: S.user.ten, hd: 'DATA_' + key, ct: json}).select('id'));
  const newId = inserted && inserted[0] && inserted[0].id;
  if (newId) {
    q(sb.from('nhatky').delete().eq('hd', 'DATA_' + key).neq('id', newId)).catch(() => {});
  }
}
async function loadCloudData(key, fallback) {
  try {
    const rows = await list('nhatky', b => b.eq('hd', 'DATA_' + key).order('luc', {ascending: false}).order('id', {ascending: false}).limit(1));
    if (rows && rows[0] && rows[0].ct) {
      localStorage.setItem(key, rows[0].ct);
      return JSON.parse(rows[0].ct);
    }
  } catch (e) {
    console.warn('Fallback localStorage for', key, e);
  }
  try {
    const local = localStorage.getItem(key);
    if (local) return JSON.parse(local);
  } catch (e) {}
  return fallback;
}

function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 3500); }
async function guard(fn, lockKey) {
  if (lockKey && busy.has(lockKey)) return;
  if (lockKey) busy.add(lockKey);
  try { await fn(); }
  catch (e) { console.error(e); toast(e.message || String(e), true); }
  finally { if (lockKey) busy.delete(lockKey); }
}

const openShift = async id => (await list('cc', b => b.eq('nvid', id).is('ra', null).order('vao', {ascending: false}).limit(1)))[0];
async function chamCong(loai) {
  if (!S.user) throw new Error('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại');
  const u = S.user, now = Date.now(), o = await openShift(u.id);
  const isKiosk = localStorage.getItem('mayChamCong') === '1';
  const tagNgoai = isKiosk ? '' : '[Máy ngoài]';

  const vao = () => q(sb.from('cc').insert({
    nvid: u.id, ten: u.ten, ngay: dStr(now), vao: now, ra: null,
    gioht: 0, giodc: null, ghichu: tagNgoai, nguoisua: '', lucsua: null,
    loai: loai === 'them' ? 'them' : 'chinh'
  }));

  if (!o) { await vao(); return {loai: 'vao', luc: now}; }
  const g = gioOf(o.vao, now);
  if (g > GIO_TOI_DA) {
    const gcQuen = ((o.ghichu || '') + ' Quên chấm ra, chờ sửa').trim();
    await q(sb.from('cc').update({ra: o.vao, gioht: 0, quen: true, ghichu: gcQuen}).eq('id', o.id));
    await vao();
    return {loai: 'vao', luc: now, canhBao: 'Ca trước quên chấm ra. Quản lý sẽ sửa giúp.'};
  }
  let gc = o.ghichu || '';
  if (!isKiosk && !gc.includes('[Máy ngoài]')) gc = (gc ? gc + ' ' : '') + '[Máy ngoài]';
  await q(sb.from('cc').update({ra: now, gioht: g, ghichu: gc}).eq('id', o.id));
  return {loai: 'ra', luc: now, gio: g};
}

V.lich = async () => {
  const ql = isQL(), a = S.wk, td = today();
  const [l0, ca, ng, nv, cc0] = await Promise.all([list('lich', inWeek), list('ca'), list('nghi', inWeek), list('nv'), list('cc', inWeek)]);
  ca.sort((x, y) => x.bat.localeCompare(y.bat));
  const cm = caMapOf(ca), getPal = buildColorMap(nv);
  const weekEmpIds = new Set([...l0.map(x => x.nvid), ...cc0.map(x => x.nvid)]);
  const activeEmps = nv.filter(x => x.role !== 'QuanLy' && (x.active !== false || weekEmpIds.has(x.id))).sort(byName);
  if (S.calFilterNv && !activeEmps.some(x => x.id === S.calFilterNv)) S.calFilterNv = '';

  const nghi = ng.filter(n => n.tt !== 'TuChoi'), days = [0,1,2,3,4,5,6].map(i => addDays(a, i));
  const legendHtml = activeEmps.length ? `<div class="emp-legend">
    <button class="leg-btn ${!S.calFilterNv ? 'on' : ''}" data-a="calFilter" data-id="">Tất cả (${activeEmps.length})</button>
    ${activeEmps.map(e => {
      const pal = getPal(e.id, e.ten);
      return `<button class="leg-btn ${S.calFilterNv === e.id ? 'on' : ''}" style="${empStyle(pal)}" data-a="calFilter" data-id="${e.id}"><span class="dot"></span>${esc(e.ten)}</button>`;
    }).join('')}
  </div>` : '';

  const caNames = new Set(ca.map(c => c.ten));
  const extraCas = [...new Set(l0.filter(x => x.tt !== 'TuChoi' && !caNames.has(x.ca)).map(x => x.ca))].map(ten => ({ten, bat: '', ket: '', isOld: true}));
  const allCas = ca.concat(extraCas);

  const renderWCard = ({nvid, ten, timeTxt, badgeHtml, isMe, isOff, isWait, isPast}) => {
    const pal = getPal(nvid, ten);
    const initial = esc(String(ten || '?').trim().charAt(0).toUpperCase());
    const cls = ['wcard', isMe ? 'me' : '', isOff ? 'off' : (isWait ? 'wait' : ''), isPast ? 'past' : ''].filter(Boolean).join(' ');
    return `<div class="${cls}" style="${empStyle(pal)}">
      <div class="wleft">
        <span class="wav">${initial}</span>
        <span class="wname">${esc(ten)}</span>
        ${badgeHtml || ''}
      </div>
      <span class="wtime">${timeTxt}</span>
    </div>`;
  };

  const card = d => {
    const isPast = d < td;
    const scheduledIdsToday = new Set();

    const rows = allCas.map(c => {
      const xs = l0.filter(x =>
        x.ngay === d && x.ca === c.ten && x.tt !== 'TuChoi' &&
        (x.tt === 'Duyet' || ql || x.nvid === S.user.id) &&
        (!S.calFilterNv || x.nvid === S.calFilterNv)
      ).sort(byName);
      if (!xs.length) return '';
      const wcards = xs.map(x => {
        scheduledIdsToday.add(x.nvid);
        const n = nghi.find(n => n.nvid === x.nvid && n.ngay === x.ngay && n.ca === x.ca);
        const isMe = x.nvid === S.user.id;
        const g = gio(x, cm);
        const rc = cc0.filter(r => r.nvid === x.nvid && r.ngay === d).sort((r1, r2) => r1.vao - r2.vao);

        let timeTxt = '';
        let stBadge = '';

        if (isPast) {
          if (rc.length) {
            timeTxt = rc.map(r => r.ra ? `${tStr(r.vao)}–${tStr(r.ra)}` : `${tStr(r.vao)}–?`).join(', ');
            stBadge = isMe ? `<span class="wbadge">Bạn</span>` : '';
          } else if (n) {
            timeTxt = (g.bat || g.ket) ? `${g.bat} – ${g.ket}` : 'Nghỉ';
            stBadge = `<span class="wbadge" style="color:#b91c1c;border-color:#fca5a5">Nghỉ</span>`;
          } else if (x.tt === 'Duyet') {
            timeTxt = (g.bat || g.ket) ? `${g.bat} – ${g.ket}` : 'Vắng';
            stBadge = `<span class="wbadge" style="color:#b91c1c;border-color:#fca5a5">Vắng</span>`;
          } else {
            timeTxt = (g.bat || g.ket) ? `${g.bat} – ${g.ket}` : 'Chờ duyệt';
            stBadge = `<span class="wbadge" style="color:#b45309;border-color:#fcd34d">Chờ duyệt</span>`;
          }
        } else {
          timeTxt = (g.bat || g.ket) ? `${g.bat} – ${g.ket}` : 'Linh hoạt';
          stBadge = n
            ? `<span class="wbadge" style="color:#b91c1c;border-color:#fca5a5">${n.tt === 'Cho' ? 'Xin nghỉ' : 'Nghỉ'}</span>`
            : (x.tt === 'Cho'
                ? `<span class="wbadge" style="color:#b45309;border-color:#fcd34d">Chờ duyệt</span>`
                : (isMe ? `<span class="wbadge">Bạn</span>` : ''));
        }

        return renderWCard({
          nvid: x.nvid, ten: x.ten, timeTxt, badgeHtml: stBadge,
          isMe, isOff: !!n, isWait: !n && x.tt === 'Cho', isPast
        });
      }).join('');
      return `<div class="sl"><div class="sn"><span>${esc(c.ten)}</span><span class="mu" style="font-size:11px;font-weight:600">${xs.length} người</span></div><div class="wcards">${wcards}</div></div>`;
    }).join('');

    // Những người đi làm thực tế trong ngày cũ nhưng chưa có lịch xếp trước đó
    let walkInBlock = '';
    if (isPast) {
      const walkInMap = {};
      cc0.filter(r => r.ngay === d && !scheduledIdsToday.has(r.nvid) && (!S.calFilterNv || r.nvid === S.calFilterNv))
        .sort((r1, r2) => r1.vao - r2.vao)
        .forEach(r => {
          if (!walkInMap[r.nvid]) walkInMap[r.nvid] = {nvid: r.nvid, ten: r.ten, shifts: []};
          walkInMap[r.nvid].shifts.push(r);
        });
      const walkIns = Object.values(walkInMap).sort(byName);
      if (walkIns.length) {
        const wcards = walkIns.map(w => {
          const isMe = w.nvid === S.user.id;
          const timeTxt = w.shifts.map(r => r.ra ? `${tStr(r.vao)}–${tStr(r.ra)}` : `${tStr(r.vao)}–?`).join(', ');
          const badgeHtml = isMe ? `<span class="wbadge">Bạn</span>` : `<span class="wbadge">Chấm công</span>`;
          return renderWCard({nvid: w.nvid, ten: w.ten, timeTxt, badgeHtml, isMe, isOff: false, isWait: false, isPast: true});
        }).join('');
        walkInBlock = `<div class="sl"><div class="sn"><span>Làm thực tế</span><span class="mu" style="font-size:11px;font-weight:600">${walkIns.length} người</span></div><div class="wcards">${wcards}</div></div>`;
      }
    }

    const content = rows + walkInBlock;
    const clsDay = ['day', d === td ? 'today' : '', isPast ? 'past' : ''].filter(Boolean).join(' ');
    return `<div class="${clsDay}"><div class="dh"><span>${wd(d)} · ${dm(d)}</span>${d === td ? '<span class="tag">Hôm nay</span>' : (isPast ? '<span style="font-size:11px;font-weight:600;opacity:.85">Đã qua</span>' : '')}</div>${content || '<div class="mu" style="padding:10px 12px">Chưa có lịch</div>'}</div>`;
  };
  $('#view').innerHTML = `${wkNav()}${legendHtml}<div class="days">${days.map(card).join('')}</div>${ql ? '' : '<p class="center"><button data-a="go" data-t="dk">Đăng ký ca cho tuần này</button></p>'}`;
};

  $('#view').innerHTML = html;
};
A.dkAll = d => document.querySelectorAll('#dkForm input.ck:not(:disabled)').forEach(x => x.checked = d.v === '1');
A.guiDk = async (d, btn) => {
  if (!S.user) throw new Error('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại');
  const ql = isQL(), target = ql ? S.dkNv : S.user.id;
  if (!target) throw new Error('Chưa chọn nhân viên');
  const ten = ql ? C.dkNv.find(x => x.id === target).ten : S.user.ten, boxes = [...document.querySelectorAll('#dkForm input.ck:not(:disabled)')];
  const add = [], upd = [], rm = [];
  for (const x of boxes) {
    const bat = $('#' + x.id + 'b').value, ket = $('#' + x.id + 'e').value, nm = `ca ${x.dataset.c} ngày ${dm(x.dataset.d)}`;
    if (x.checked) {
      if (!bat || !ket) throw new Error('Nhập đủ giờ cho ' + nm);
      if (ket <= bat) throw new Error(nm + ': giờ kết thúc phải sau giờ vào');
      if (!x.dataset.lid) add.push({d: x.dataset.d, c: x.dataset.c, bat, ket});
      else if (bat !== x.dataset.ob || ket !== x.dataset.ok) upd.push({id: x.dataset.lid, bat, ket});
    } else if (x.dataset.lid) rm.push(x.dataset.lid);
  }
  if (!add.length && !upd.length && !rm.length) throw new Error('Chưa thay đổi gì');
  btn.disabled = true;
  let nAdded = 0, nUpdated = 0, nRemoved = 0;
  try {
    const tasks = [];
    if (rm.length) {
      let dq = sb.from('lich').delete().in('id', rm);
      if (!ql) dq = dq.eq('tt', 'Cho');
      tasks.push(q(dq.select('id')).then(res => nRemoved = (res || []).length));
    }
    for (const u of upd) {
      let uq = sb.from('lich').update({bat: u.bat, ket: u.ket}).eq('id', u.id);
      if (!ql) uq = uq.eq('tt', 'Cho');
      tasks.push(q(uq.select('id')).then(res => nUpdated += (res || []).length));
    }
    if (add.length) {
      tasks.push((async () => {
        const cu = await list('lich', r => r.eq('nvid', target).gte('ngay', S.wk).lte('ngay', addDays(S.wk, 6)));
        const seen = new Set();
        const ins = add.filter(x => {
          const key = x.d + '|' + x.c;
          if (seen.has(key)) return false;
          seen.add(key);
          return !cu.some(y => y.ngay === x.d && y.ca === x.c && y.tt !== 'TuChoi');
        }).map(x => ({nvid: target, ten, ngay: x.d, ca: x.c, bat: x.bat, ket: x.ket, tt: ql ? 'Duyet' : 'Cho'}));
        if (ins.length) {
          const inserted = await q(sb.from('lich').insert(ins).select('id'));
          nAdded = (inserted || []).length;
        }
      })());
    }
    await Promise.all(tasks);
  } finally { btn.disabled = false; }

  if (ql) {
    await ghiLog('Xếp lịch', `${ten}: thêm ${nAdded}, sửa ${nUpdated}, bỏ ${nRemoved} (tuần ${S.wk})`);
    done('Đã cập nhật lịch');
  } else {
    const skipped = (rm.length - nRemoved) + (upd.length - nUpdated);
    if (skipped > 0) done(`Đã cập nhật (${skipped} ca vừa được quản lý duyệt nên giữ nguyên)`);
    else done(nAdded || nUpdated ? `Đã gửi ${nAdded + nUpdated} ca, chờ quản lý duyệt` : 'Đã cập nhật đăng ký');
  }
};
A.duyetNhieu = async d => {

  const cnt = (updated || []).length;

V.lt = async () => {
  if (!isQL()) return;
  const ky = S.ky, td = today(), [y, m] = ky.split('-').map(Number), nd = new Date(y, m, 0).getDate();
  const allDays = Array.from({length: nd}, (_, i) => ky + '-' + String(i + 1).padStart(2, '0'));
  const days = S.ltHalf === 1 ? allDays.slice(0, 15) : allDays.slice(15);

  const [nv, cc, lich, nghi, ca] = await Promise.all([
    list('nv'), list('cc', b => inMonth(b, ky)),
    list('lich', b => inMonth(b, ky)), list('nghi', b => inMonth(b, ky)), list('ca')
  ]);
  const cm = caMapOf(ca); cc.forEach(r => r.tre = isTre(r, lich, cm));
  const getPal = buildColorMap(nv);
  const hasDataIds = new Set([...cc.map(r => r.nvid), ...lich.map(l => l.nvid)]);
  const emp = nv.filter(x => x.role !== 'QuanLy' && (x.active !== false || hasDataIds.has(x.id))).sort(byName);
  if (S.calFilterNv && !emp.some(x => x.id === S.calFilterNv)) S.calFilterNv = '';

  const legendHtml = emp.length ? `<div class="emp-legend">
    <button class="leg-btn ${!S.calFilterNv ? 'on' : ''}" data-a="calFilter" data-id="">Tất cả (${emp.length})</button>
    ${emp.map(e => {
      const pal = getPal(e.id, e.ten);
      return `<button class="leg-btn ${S.calFilterNv === e.id ? 'on' : ''}" style="${empStyle(pal)}" data-a="calFilter" data-id="${e.id}"><span class="dot"></span>${esc(e.ten)}</button>`;
    }).join('')}
  </div>` : '';

  const dayBox = d => {
    const items = [];
    let detailLines = [];
    const activeIds = new Set();

    emp.forEach(n => {
      if (S.calFilterNv && n.id !== S.calFilterNv) return;
      const pal = getPal(n.id, n.ten);
      const st = empStyle(pal);
      const rc = cc.filter(r => r.nvid === n.id && r.ngay === d);
      const ls = lich.filter(l => l.nvid === n.id && l.ngay === d && l.tt !== 'TuChoi');
      const ng = nghi.filter(x => x.nvid === n.id && x.ngay === d && x.tt !== 'TuChoi');

      rc.forEach(r => {
        const h = hrs(r);
        const ngoaiTxt = isMayNgoai(r) ? ' [máy ngoài]' : '';
        activeIds.add(n.id);
        if (!r.ra) {
          items.push(`<div class="mitem wait" style="${st}"><div class="mitem-top"><span class="mitem-name">${esc(n.ten)}</span><span>🟢</span></div><div class="mitem-sub">Từ ${tStr(r.vao)}</div></div>`);
          detailLines.push(`▪ <b>${esc(n.ten)}</b>: Đang làm từ ${tStr(r.vao)}${ngoaiTxt}`);
        } else {
          const treIcon = r.tre ? ' ⚠️' : '';
          items.push(`<div class="mitem" style="${st}"><div class="mitem-top"><span class="mitem-name">${esc(n.ten)}</span><span>${h}h${treIcon}</span></div><div class="mitem-sub">${tStr(r.vao)}-${tStr(r.ra)}</div></div>`);
          detailLines.push(`▪ <b>${esc(n.ten)}</b>: Đã làm <b>${h}h</b> (${tStr(r.vao)}–${tStr(r.ra)})${r.tre ? ' <b class="tre">[Đi trễ]</b>' : ''}${ngoaiTxt}`);
        }
      });

      ng.forEach(x => {
        const cho = x.tt === 'Cho';
        items.push(`<div class="mitem ${cho ? 'wait' : 'off'}" style="${st}"><div class="mitem-top"><span class="mitem-name">${esc(n.ten)}</span><span>${cho ? 'Xin nghỉ' : 'Nghỉ'}</span></div><div class="mitem-sub">${esc(x.ca)}</div></div>`);
        detailLines.push(`▪ <b>${esc(n.ten)}</b>: ${cho ? 'Xin nghỉ' : 'Nghỉ'} ca ${esc(x.ca)} (${esc(x.lydo || 'Không rõ lý do')})`);
      });

      ls.forEach(l => {
        if (ng.some(x => x.ca === l.ca)) return;
        const g = gio(l, cm);
        const isCovered = () => {
          if (!rc.length) return false;
          if (!g.bat) return true;
          const sBat = toMs(l.ngay + 'T' + g.bat);
          let sKet = g.ket ? toMs(l.ngay + 'T' + g.ket) : (sBat + 4 * 3600000);
          if (sKet <= sBat) sKet += 864e5;
          return rc.some(r => {
            if (!r.vao) return false;
            const rRa = r.ra || (r.vao + 3600000);
            return r.vao <= sKet - 15 * 60000 && rRa >= sBat + 15 * 60000;
          });
        };
        const timeTxt = (g.bat || g.ket) ? `${g.bat}-${g.ket}` : 'chưa có giờ';
        const delBtn = ` <button class="red xs" data-a="xoaLichId" data-id="${l.id}" data-c="Xóa ca ${esc(l.ca)} của ${esc(n.ten)} ngày ${dm(d)}?">Xóa ca</button>`;
        if (l.tt === 'Duyet') {
          if (d < td && rc.length === 0) {
            items.push(`<div class="mitem abs"><div class="mitem-top"><span class="mitem-name">${esc(n.ten)}</span><span>Vắng</span></div><div class="mitem-sub">${esc(l.ca)} · ${timeTxt}</div></div>`);
            detailLines.push(`▪ <b>${esc(n.ten)}</b>: <b class="bad">Vắng mặt</b> ${esc(l.ca)} (${timeTxt})${delBtn}`);
          } else if (d > td || (d === td && !isCovered())) {
            activeIds.add(n.id);
            items.push(`<div class="mitem" style="${st}"><div class="mitem-top"><span class="mitem-name">${esc(n.ten)}</span></div><div class="mitem-sub">${esc(l.ca)} · ${timeTxt}</div></div>`);
            detailLines.push(`▪ <b>${esc(n.ten)}</b>: ${esc(l.ca)} (<b>${timeTxt}</b>)${delBtn}`);
          }
        } else {
          items.push(`<div class="mitem wait" style="${st}"><div class="mitem-top"><span class="mitem-name">${esc(n.ten)}</span><span>?</span></div><div class="mitem-sub">${esc(l.ca)} · ${timeTxt}</div></div>`);
          detailLines.push(`▪ <b>${esc(n.ten)}</b>: Chờ duyệt ${esc(l.ca)} (${timeTxt})${delBtn}`);
        }
      });
    });
    const activeCount = activeIds.size;

    const infoHtml = `<b>📅 ${wd(d)}, ngày ${dm(d)}/${ky.slice(0, 4)}</b><br>` +
      (detailLines.length ? detailLines.join('<br>') : '<span class="mu">Không có lịch làm việc hay chấm công.</span>') +
      `<div class="row" style="margin:8px 0 0"><button class="sm" data-a="go" data-t="dk" data-wk="${monday(d)}">✏️ Sửa lịch tuần này</button> <button class="ghost sm" data-a="go" data-t="bc">📋 Sang Bảng công</button></div>`;

    const cls = ['mday', isWknd(d) ? 'wknd' : '', d === td ? 'today' : ''].filter(Boolean).join(' ');
    return `<div class="${cls}" data-a="ltInfo" data-i="${esc(infoHtml)}">
      <div class="mday-hd">
        <span>${d.slice(8, 10)}/${d.slice(5, 7)} · ${wd(d)}</span>
        ${activeCount ? `<span class="mday-cnt">${activeCount} NV</span>` : ''}
      </div>
      <div class="mday-body">
        ${items.join('') || '<span class="mu" style="font-size:11px;margin:auto">Trống</span>'}
      </div>
    </div>`;
  };

  $('#view').innerHTML = `<div class="card">
    <div class="row" style="justify-content:space-between">
      ${mp()}
      <div class="seg">
        <button class="${S.ltHalf === 1 ? 'on' : ''}" data-a="ltHalf" data-h="1">📅 Ngày 01 – 15</button>
        <button class="${S.ltHalf === 2 ? 'on' : ''}" data-a="ltHalf" data-h="2">📅 Ngày 16 – ${nd}</button>
      </div>
    </div>
    ${legendHtml}
    <div class="row mu" style="font-size:12px;margin-bottom:4px">
      <span>• <b>Ô màu liền</b>: Lịch duyệt / Đã làm</span>
      <span>• <b>Viền đứt</b>: Chờ duyệt / Đang làm</span>
      <span>• <b>Gạch ngang</b>: Nghỉ</span>
      <span>• <i>Bấm vào ô ngày bất kỳ để xem chi tiết</i></span>
    </div>
    <div class="mgrid15">${days.map(dayBox).join('')}</div>
  </div>`;
};

/* ---------- Bảng công (quản lý) ---------- */
V.bc = async () => {
  const td = today();
  const [rows, nv, k, lich, ca, ng] = await Promise.all([
    list('cc', b => inMonth(b, S.ky)),
    list('nv'),
    list('ky', b => b.eq('ky', S.ky)),
    list('lich', b => inMonth(b, S.ky)),
    list('ca'),
    list('nghi', b => inMonth(b, S.ky))
  ]);
  C.chot = !!(k[0] && k[0].chot);
  C.cm = caMapOf(ca);
  const nameMap = {};
  nv.forEach(n => nameMap[n.id] = n.ten);
  rows.forEach(r => {
    r.ten = nameMap[r.nvid] || r.ten;
    r.tre = isTre(r, lich, C.cm);
    const overMax = !r.ra && (Date.now() - r.vao) > GIO_TOI_DA * 3600000;
    r.live = !r.ra && !overMax;
    r.warn = overMax || (r.quen && r.giodc == null);
  });
  C.rows = rows.sort((a, b) => a.vao - b.vao);
  C.nv = nv;
  C.nghi = ng.filter(x => x.tt === 'Duyet');
  C.lich = lich.filter(x => x.tt === 'Duyet');
  C.map = {};
  rows.forEach(r => C.map[r.id] = r);
  C.dangThieu = rows.filter(r => r.warn);
  C.lCho = lich.filter(x => x.tt === 'Cho');
  C.nCho = ng.filter(x => x.tt === 'Cho');
  C.bcKy = S.ky;
  renderBc();
};

function renderBc() {
  const dis = C.chot ? 'disabled' : '';
  const hasDataIds = new Set([...C.rows.map(r => r.nvid), ...C.lich.map(l => l.nvid)]);
  const emp = C.nv.filter(x => x.role !== 'QuanLy' && (x.active !== false || hasDataIds.has(x.id))).sort(byName);
  if (S.fnv && !emp.some(x => x.id === S.fnv)) S.fnv = '';
  const lam = new Set(C.rows.filter(r => r.ra && !isThem(r) && hrs(r) > 0).map(r => r.nvid + '|' + r.ngay));
  const st = emp.map(n => {
    const mine = C.rows.filter(r => r.nvid === n.id), t = tong(mine);
    const liveRow = mine.find(r => r.live);
    return {
      n, mine, t, ft: n.hinhthuc === 'FT',
      tre: mine.filter(r => r.tre).length,
      warn: mine.filter(r => r.warn).length,
      liveRow,
      coMat: new Set(mine.filter(r => r.ra).map(r => r.ngay)).size,
      nghi: new Set(C.nghi.filter(x => x.nvid === n.id && !lam.has(n.id + '|' + x.ngay)).map(x => x.ngay)).size
    };

A.luuCong = async d => {
  const r = C.map[d.id];
  if (!r) throw new Error('Không tìm thấy dòng công, hãy tải lại trang');
  await chkMo(r.ngay.slice(0, 7));
  const vao = toMs($('#v_' + d.id).value);
  let ra = toMs($('#r_' + d.id).value);
  const dcRaw = $('#d_' + d.id).value.trim();
  const loai = $('#l_' + d.id).value === 'them' ? 'them' : 'chinh';
  const gioDC = dcRaw === '' ? null : Number(dcRaw);
  const gc = $('#g_' + d.id).value.trim() || 'Quản lý điều chỉnh';

  if (!vao) throw new Error('Giờ vào không hợp lệ');
  if (gioDC !== null && (isNaN(gioDC) || gioDC < 0)) throw new Error('Giờ điều chỉnh không hợp lệ');
  if (!ra && gioDC !== null && gioDC > 0) {
    ra = vao + Math.round(gioDC * 3600000);
  }
  if (ra && ra <= vao) throw new Error('Giờ ra phải sau giờ vào');

  const gioHT = ra ? gioOf(vao, ra) : 0;
  await q(sb.from('cc').update({
    vao, ra, loai, ngay: dStr(vao),
    gioht: gioHT, giodc: gioDC, ghichu: gc,
    quen: false, nguoisua: S.user.ten, lucsua: Date.now()
  }).eq('id', d.id));
  await ghiLog('Sửa công', `${r.ten} ${r.ngay}: ${LOAI[r.loai || 'chinh']} ${tStr(r.vao)}-${tStr(r.ra)} (ĐC ${r.giodc ?? '-'}) → ${LOAI[loai]} ${tStr(vao)}-${tStr(ra)} (ĐC ${gioDC ?? '-'}). Lý do: ${gc}`);
  done('Đã lưu thay đổi công!');
};

function calcSheetRow(r, ngayChuan) {
  const nc = Math.max(1, Number(ngayChuan) || 26);
  const isFT = r.loai === 'FT';
  const luongCung = isFT
    ? Math.round((Number(r.luongCB || 0) / nc) * Number(r.cong || 0) + Number(r.luong1h || 0) * Number(r.gio || 0))
    : Math.round(Number(r.luong1h || 0) * Number(r.gio || 0));
  const thucLanh = luongCung + Number(r.kpi || 0) + Number(r.live || 0) + Number(r.chuyenCan || 0) - Number(r.phat || 0) - Number(r.ung || 0);
  return {luongCung, thucLanh};
}

function getLiveSumMap() {
  const map = {};
  (C.liveList || []).forEach(item => {
    const key = normName(item.ten);
    if (key) map[key] = (map[key] || 0) + Number(item.hoaHong || 0);
  });
  return map;
}

function syncInputsToState() {
  if (!C.sheetRows) return;
  const ncEl = $('#ngayChuan');
  if (ncEl) C.ngayChuan = Math.max(1, Number(ncEl.value) || 26);
  const pubEl = $('#pubStaff');
  if (pubEl) C.publicToStaff = pubEl.checked;

  C.sheetRows.forEach((r, i) => {
    const tenEl = $(`#sr_${i}_ten`);
    if (tenEl) r.ten = tenEl.value.trim();
    const loaiEl = $(`#sr_${i}_loai`);
    if (loaiEl) r.loai = loaiEl.value;
    const cbEl = $(`#sr_${i}_cb`);
    if (cbEl) r.luongCB = Number(cbEl.value || 0);
    const h1El = $(`#sr_${i}_1h`);
    if (h1El) r.luong1h = Number(h1El.value || 0);
    const congEl = $(`#sr_${i}_cong`);
    if (congEl) r.cong = Number(congEl.value || 0);
    const gioEl = $(`#sr_${i}_gio`);
    if (gioEl) r.gio = Number(gioEl.value || 0);
    const kpiEl = $(`#sr_${i}_kpi`);
    if (kpiEl) r.kpi = Number(kpiEl.value || 0);
    const liveEl = $(`#sr_${i}_live`);
    if (liveEl) r.live = Number(liveEl.value || 0);
    const ccEl = $(`#sr_${i}_cc`);
    if (ccEl) r.chuyenCan = Number(ccEl.value || 0);
    const phatEl = $(`#sr_${i}_phat`);
    if (phatEl) r.phat = Number(phatEl.value || 0);
    const ungEl = $(`#sr_${i}_ung`);
    if (ungEl) r.ung = Number(ungEl.value || 0);
  });
}

function recalcSheetUI() {
  if (!C.sheetRows) return;
  syncInputsToState();
  const nc = C.ngayChuan || 26;
  let sumCung = 0, sumKpi = 0, sumLive = 0, sumCc = 0, sumPhat = 0, sumUng = 0, sumThucLanh = 0;

  C.sheetRows.forEach((r, i) => {
    const {luongCung, thucLanh} = calcSheetRow(r, nc);
    r.luongCung = luongCung;
    r.thucLanh = thucLanh;
    sumCung += luongCung;
    sumKpi += r.kpi;
    sumLive += r.live;
    sumCc += r.chuyenCan;
    sumPhat += r.phat;
    sumUng += r.ung;
    sumThucLanh += thucLanh;

    const lcEl = $(`#sr_lc_${i}`);
    const tlEl = $(`#sr_tl_${i}`);
    if (lcEl) lcEl.textContent = fmtMoney(luongCung);
    if (tlEl) tlEl.textContent = fmtMoney(thucLanh);
  });

  if ($('#ft_cung')) $('#ft_cung').textContent = fmtMoney(sumCung);
  if ($('#ft_kpi')) $('#ft_kpi').textContent = fmtMoney(sumKpi);
  if ($('#ft_live')) $('#ft_live').textContent = fmtMoney(sumLive);
  if ($('#ft_cc')) $('#ft_cc').textContent = fmtMoney(sumCc);
  if ($('#ft_phat')) $('#ft_phat').textContent = fmtMoney(sumPhat);
  if ($('#ft_ung')) $('#ft_ung').textContent = fmtMoney(sumUng);
  if ($('#ft_tl')) $('#ft_tl').textContent = fmtMoney(sumThucLanh) + ' đ';
  if ($('#topTongQuy')) $('#topTongQuy').textContent = fmtMoney(sumThucLanh) + ' đ';
}

  if (savedSheet && Array.isArray(savedSheet.rows)) {
    savedSheet.rows.forEach(r => { if (r.nvid) hasDataIds.add(r.nvid); });
  }
  const emp = nvAll.filter(x => x.role !== 'QuanLy' && (x.active !== false || hasDataIds.has(x.id))).sort(byName);

  const appStatsById = {};
  emp.forEach(n => {
    const mine = ccRows.filter(r => r.nvid === n.id);
    const t = tong(mine);
    const ft = n.hinhthuc === 'FT';
    appStatsById[n.id] = {
      ten: n.ten, loai: ft ? 'FT' : 'PT',
      appCong: ft ? t.cong : 0, appGio: ft ? t.gioLe : r2(t.gioChinh + t.gioThem)
    };
  });
  C.appStatsById = appStatsById;

  const savedRows = (savedSheet && Array.isArray(savedSheet.rows)) ? savedSheet.rows : [];
  const usedIds = new Set();
  const merged = [];

  savedRows.forEach(sr => {
    const appSt = sr.nvid ? appStatsById[sr.nvid] : null;
    if (sr.nvid) usedIds.add(sr.nvid);
    const ten = appSt ? appSt.ten : (sr.ten || '');
    const liveAuto = liveSumMap[normName(ten)] || 0;
    const congManual = !!sr.congManual;
    const liveManual = !!sr.liveManual;

    merged.push({
      nvid: sr.nvid || '', ten,
      loai: sr.loai || (appSt ? appSt.loai : 'PT'),
      luongCB: Number(sr.luongCB ?? (sr.loai === 'FT' ? 6000000 : 0)),
      luong1h: Number(sr.luong1h ?? 25000),
      cong: congManual ? Number(sr.cong || 0) : (appSt ? appSt.appCong : Number(sr.cong || 0)),
      gio: congManual ? Number(sr.gio || 0) : (appSt ? appSt.appGio : Number(sr.gio || 0)),
      appCong: appSt ? appSt.appCong : null, appGio: appSt ? appSt.appGio : null,
      congManual, kpi: Number(sr.kpi || 0),
      live: liveManual ? Number(sr.live || 0) : liveAuto,
      liveAuto, liveManual, chuyenCan: Number(sr.chuyenCan || 0),
      phat: Number(sr.phat || 0), ung: Number(sr.ung || 0),
      customRow: !sr.nvid
    });
  });

  emp.forEach(n => {
    if (usedIds.has(n.id)) return;
    const appSt = appStatsById[n.id];
    const prev = baseRatesById[n.id] || baseRatesByName[normName(n.ten)] || null;
    const liveAuto = liveSumMap[normName(n.ten)] || 0;
    merged.push({
      nvid: n.id, ten: n.ten, loai: appSt.loai,
      luongCB: prev ? Number(prev.luongCB || 0) : (appSt.loai === 'FT' ? 6000000 : 0),
      luong1h: prev ? Number(prev.luong1h || 25000) : 25000,
      cong: appSt.appCong, gio: appSt.appGio,
      appCong: appSt.appCong, appGio: appSt.appGio,
      congManual: false, kpi: 0, live: liveAuto, liveAuto, liveManual: false,
      chuyenCan: 0, phat: 0, ung: 0, customRow: false
    });
  });

  C.sheetRows = merged;
  renderLuongSheet();
};

  $('#view').innerHTML = headerHtml + bodyHtml;

function renderPhieuCard(p, ky, nc, showActions) {

  const donGiaText = isFT ? `${fmtMoney(p.luongCB)}đ/tháng (${nc} công)${Number(p.gio) > 0 ? ` · ${fmtMoney(p.luong1h)}đ/h` : ''}` : `${fmtMoney(p.luong1h)}đ/giờ`;

  return `
  <div class="slip" id="slipCard">
    <div class="slip-hd">
      <div style="font-size:12px;color:var(--mu);font-weight:700;letter-spacing:1px">HOMME STORE & WORKSHOP</div>
      <h2 style="margin:4px 0 2px;color:var(--pd);font-size:20px">PHIẾU LƯƠNG THÁNG ${esc(ky)}</h2>
    </div>
    <div class="slip-row"><span class="mu">Họ và tên:</span><b style="font-size:16px">${esc(p.ten)}</b></div>
    <div class="slip-row"><span class="mu">Loại hình:</span><b>${isFT ? 'Full-time (FT)' : 'Part-time (PT)'}</b></div>
    <div class="slip-row"><span class="mu">Đơn giá:</span><span style="font-size:13px">${donGiaText}</span></div>
    <div class="slip-row"><span class="mu">Tổng giờ / công:</span><b>${congText}</b></div>
    <div style="margin-top:8px;padding-top:8px;border-top:1px solid #cbd5e1">
      <div class="slip-row"><span>Lương cứng:</span><b>${fmtMoney(p.luongCung)} đ</b></div>
      <div class="slip-row"><span>Thưởng KPI:</span><b class="${p.kpi ? 'ok' : 'mu'}">${p.kpi ? '+' + fmtMoney(p.kpi) + ' đ' : '0 đ'}</b></div>
      <div class="slip-row"><span>Thưởng Livestream:</span><b class="${p.live ? 'ok' : 'mu'}">${p.live ? '+' + fmtMoney(p.live) + ' đ' : '0 đ'}</b></div>
      <div class="slip-row"><span>Thưởng Chuyên cần:</span><b class="${p.chuyenCan ? 'ok' : 'mu'}">${p.chuyenCan ? '+' + fmtMoney(p.chuyenCan) + ' đ' : '0 đ'}</b></div>
      ${p.phat ? `<div class="slip-row" style="color:var(--bad)"><span>Phạt / Khấu trừ:</span><b>-${fmtMoney(p.phat)} đ</b></div>` : ''}
      ${p.ung ? `<div class="slip-row" style="color:var(--warn)"><span>Đã ứng lương:</span><b>-${fmtMoney(p.ung)} đ</b></div>` : ''}
    </div>
    <div class="slip-tot">
      <span style="font-weight:800;color:#166534;font-size:14px">TỔNG THỰC LÃNH:</span>
      <b style="font-size:21px;color:var(--ok)">${fmtMoney(p.thucLanh)} đ</b>
    </div>
    ${showActions ? `
      <div class="row" style="justify-content:center;margin-top:14px">
        <button class="green sm" data-a="downloadSlipImg" data-i="${S.phieuIdx}">🖼️ Xuất ảnh gửi Zalo</button>
        <button class="ghost sm" data-a="copySlipText" data-i="${S.phieuIdx}">📋 Copy tin nhắn</button>
      </div>` : ''}
  </div>`;
}

A.setLuongTab = d => { if (S.lsheet === 'bangluong') syncInputsToState(); S.lsheet = d.t; renderLuongSheet(); };
A.openPhieuRow = d => { syncInputsToState(); S.phieuIdx = Number(d.i); S.lsheet = 'phieuluong'; renderLuongSheet(); };
A.stepPhieu = d => { const len = C.sheetRows.length; S.phieuIdx = (S.phieuIdx + Number(d.d) + len) % len; renderLuongSheet(); };
A.showAllSlips = () => {

async function syncLiveToSavedSheet(ky, liveArr) {
  const sumMap = {};
  (liveArr || []).forEach(item => {
    const k = normName(item.ten);
    if (k) sumMap[k] = (sumMap[k] || 0) + Number(item.hoaHong || 0);
  });
  const savedSheet = await loadCloudData('SHEET_LUONG_' + ky, null);
  if (savedSheet && Array.isArray(savedSheet.rows)) {
    savedSheet.rows.forEach(r => {
      if (!r.liveManual) r.live = sumMap[normName(r.ten)] || 0;
    });
    await saveCloudData('SHEET_LUONG_' + ky, savedSheet);
  }
  return sumMap;
}
A.themLive = async () => {
  if (!isQL()) return;
  const ngay = $('#lvNgay').value, ca = $('#lvCa').value.trim(), ten = $('#lvTen').value.trim();
  const doanhThu = Number($('#lvDt').value || 0), pct = Number($('#lvPct').value || 0), ghiChu = $('#lvGc').value.trim();
  if (!ngay || !ten || doanhThu <= 0 || pct <= 0) throw new Error('Nhập đủ thông tin, doanh thu và % hoa hồng');
  const hoaHong = Math.round(doanhThu * pct / 100), ky = ngay.slice(0, 7);
  const latestList = await loadCloudData('LIVE_' + ky, []);
  const id = Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  latestList.push({id, ngay, ca, ten, doanhThu, pct, hoaHong, ghiChu});
  await saveCloudData('LIVE_' + ky, latestList);
  const liveSumMap = await syncLiveToSavedSheet(ky, latestList);
  if (ky === S.ky) {
    C.liveList = latestList;
    C.sheetRows.forEach(r => { r.liveAuto = liveSumMap[normName(r.ten)] || 0; if (!r.liveManual) r.live = r.liveAuto; });
  }

A.xoaLive = async d => {

A.luuNV = async d => {
  const i = +d.i, x = C.nvAll[i], g = k => $('#n_' + i + '_' + k).value.trim();
  const ten = g('ten'), pin = g('pin').replace(/\s+/g, ''), role = g('vt'), active = g('hd') === 'Y', hinhthuc = g('ht') === 'FT' ? 'FT' : 'PT';
  if (!ten || (pin && !/^\d{4,6}$/.test(pin)) || (!x.id && !pin)) throw new Error('Nhập sai tên hoặc mã PIN');
  if (x.id === S.user.id && (role !== 'QuanLy' || !active)) throw new Error('Không thể tự hạ quyền mình');
  if (C.nvAll.some((y, j) => j !== i && normName(y.ten) === normName(ten))) throw new Error('Tên bị trùng với người khác');
  let id = x.id;
  if (id) {
    const tasks = [q(sb.from('nv').update({ten, role, active, hinhthuc}).eq('id', id))];
    if (x.ten !== ten) ['cc', 'lich', 'nghi'].forEach(t => tasks.push(q(sb.from(t).update({ten}).eq('nvid', id))));
    await Promise.all(tasks);
  } else { id = (await q(sb.from('nv').insert({ten, role, active, hinhthuc}).select().single())).id; }
  if (pin) { await q(sb.rpc('dat_pin', {p_actor: S.user.id, p_actor_pin: S.pin, p_target: id, p_new: pin})); if (id === S.user.id) S.pin = pin; }
  await ghiLog(x.id ? 'Sửa NV' : 'Thêm NV', ten); done();
};
